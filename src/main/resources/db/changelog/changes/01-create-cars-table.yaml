databaseChangeLog:
  - changeSet:
      id: create-car-type-enum
      author: Ki_ne_rei_ko
      changes:
        - sql:
            sql: CREATE TYPE car_type AS ENUM ('SEDAN','SUV','HATCHBACK','UNIVERSAL');

  - changeSet:
      id: create-cars-table
      author: Ki_ne_rei_ko
      changes:
        - createTable:
            tableName: cars
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: model
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: brand
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: car_type
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: inventory
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: daily_fee
                  type: numeric(10, 2)
                  constraints:
                    nullable: false
